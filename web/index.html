<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robô eKyte Web</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Esse script é injetado automaticamente pelo Python -->
    <script type="text/javascript" src="/eel.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Sidebar: Configurações -->
      <div class="config-card">
        <h2>⚙️ Configurações</h2>

        <div class="input-group">
          <label for="email">E-mail do eKyte</label>
          <input type="email" id="email" placeholder="seu@email.com" />
        </div>

        <div class="input-group">
          <label for="senha">Senha do eKyte</label>
          <div class="password-wrapper">
            <input type="password" id="senha" placeholder="Sua senha" />
            <button
              type="button"
              id="btn-toggle-senha"
              class="btn-icon"
              aria-label="Mostrar senha"
              title="Mostrar senha"
              onclick="alternarVisibilidadeSenha()"
            >
              👁️
            </button>
          </div>
        </div>

        <div class="input-group">
          <label id="label-pasta">Pasta das Imagens</label>
          <button
            type="button"
            id="btn-pasta"
            class="btn btn-secondary"
            aria-labelledby="label-pasta"
            onclick="escolherPasta()"
          >
            <svg
              width="14"
              height="14"
              version="1.1"
              id="fi_891094"
              xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink"
              x="0px"
              y="0px"
              viewBox="0 0 512 512"
              style="enable-background: new 0 0 512 512"
              xml:space="preserve"
            >
              <path
                style="fill: #ffa000"
                d="M437.333,53.334H74.667c-29.384-0.048-53.244,23.734-53.292,53.119

	c4.706-2.738,10.065-4.153,15.509-4.096h75.947c13.706,0.038,25.883,8.755,30.336,21.717l1.813,5.845
	c7.34,21.727,27.691,36.375,50.624,36.437h246.613c5.594,0.005,11.088,1.476,15.936,4.267c1.638,0.955,3.501,1.455,5.397,1.451
	c5.891,0,10.667-4.776,10.667-10.667v-69.717C490.667,77.212,466.789,53.334,437.333,53.334z"
              ></path>
              <path
                style="fill: #ffc107"
                d="M485.397,167.211c-8.114-4.729-17.339-7.217-26.731-7.211H212.053
	c-13.706-0.038-25.883-8.755-30.336-21.717l-1.813-5.845c-7.34-21.727-27.691-36.375-50.624-36.437H53.333
	c-9.165-0.089-18.184,2.291-26.112,6.891C10.408,112.301-0.005,130.066,0,149.334v256c0,29.455,23.878,53.333,53.333,53.333h405.333
	c29.455,0,53.333-23.878,53.333-53.333v-192C512.065,194.296,501.909,176.688,485.397,167.211z"
              ></path>
              <g></g>
              <g></g>
              <g></g>
              <g></g>
              <g></g>
              <g></g>
              <g></g>
              <g></g>
              <g></g>
              <g></g>
              <g></g>
              <g></g>
              <g></g>
              <g></g>
              <g></g></svg
            >Escolher Diretório
          </button>
          <span
            id="caminho-pasta"
            class="text-muted"
            title="Nenhuma pasta selecionada"
            >Nenhuma pasta selecionada</span
          >
        </div>

        <div class="switches-group">
          <label>
            <input type="checkbox" id="modo-invisivel" /> Ocultar Chrome
          </label>
          <label> <input type="checkbox" id="modo-teste" /> Vídeo (dev) </label>
        </div>

        <button
          type="button"
          class="btn btn-primary"
          id="btn-iniciar"
          onclick="iniciarRobo()"
        >
          🚀 INICIAR AUTOMAÇÃO
        </button>
        <button
          type="button"
          class="btn btn-danger hidden"
          id="btn-parar"
          onclick="pararRobo()"
        >
          🛑 PARAR AUTOMAÇÃO
        </button>
      </div>

      <!-- Main Content: Dados e Logs -->
      <div class="data-card">
        <div class="header-docs">
          <h2>📝 Texto do Planejamento</h2>
          <button
            type="button"
            id="btn-formatar"
            class="btn btn-warning"
            onclick="padronizarTexto()"
            title="Organizar e formatar o texto do planejamento automaticamente"
          >
            🧹 Padronizar
          </button>
        </div>

        <textarea
          id="texto-docs"
          aria-label="Texto do planejamento"
          placeholder="Cole o texto aqui..."
        ></textarea>

        <h2>🖥️ Terminal de Execução</h2>
        <textarea
          id="terminal-log"
          aria-label="Terminal de execução"
          role="log"
          aria-live="polite"
          readonly
        ></textarea>

        <div class="progress-container">
          <div
            class="progress-bar-bg"
            role="progressbar"
            id="barra-progresso-container"
            aria-label="Progresso da automação"
            aria-valuenow="0"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <div class="progress-bar-fill" id="barra-progresso"></div>
          </div>
          <span id="texto-progresso" class="text-progress">0%</span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
