<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robô eKyte Web</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Esse script é injetado automaticamente pelo Python -->
    <script type="text/javascript" src="/eel.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Sidebar: Configurações -->
      <div class="config-card">
        <h2>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          Configurações
        </h2>

        <div class="input-group">
          <label for="email">E-mail do eKyte</label>
          <input type="email" id="email" placeholder="seu@email.com" />
        </div>

        <div class="input-group">
          <label for="senha">Senha do eKyte</label>
          <div class="password-wrapper">
            <input type="password" id="senha" placeholder="Sua senha" />
            <button
              type="button"
              id="btn-toggle-senha"
              class="btn-icon"
              aria-label="Mostrar senha"
              title="Mostrar senha"
              onclick="alternarVisibilidadeSenha()"
            >
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="input-group">
          <label id="label-pasta">Pasta das Imagens</label>
          <button
            type="button"
            id="btn-pasta"
            class="btn btn-secondary"
            onclick="escolherPasta()"
          >
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
            Escolher Diretório
          </button>
          <span
            id="caminho-pasta"
            class="text-muted"
            title="Nenhuma pasta selecionada"
            >Nenhuma pasta selecionada</span
          >
        </div>

        <div class="switches-group">
          <label class="toggle-switch">
            <input type="checkbox" id="modo-invisivel" />
            <span class="slider"></span>
            Ocultar Chrome
          </label>
          <label class="toggle-switch">
            <input type="checkbox" id="criar-tarefas" />
            <span class="slider"></span>
            Criar tarefas
          </label>
        </div>

        <button
          type="button"
          class="btn btn-primary"
          id="btn-iniciar"
          onclick="iniciarRobo()"
        >
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
          INICIAR AUTOMAÇÃO
        </button>
        <button
          type="button"
          class="btn btn-danger hidden"
          id="btn-parar"
          onclick="pararRobo()"
        >
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
          PARAR AUTOMAÇÃO
        </button>
      </div>

      <!-- Main Content: Dados e Logs -->
      <div class="data-card">
        <div class="header-docs">
          <h2>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            Texto do Planejamento
          </h2>
          <button
            type="button"
            id="btn-formatar"
            class="btn btn-warning"
            onclick="padronizarTexto()"
            title="Organizar e formatar o texto do planejamento automaticamente"
          >
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.28 1.28L3 12l5.8 1.9a2 2 0 0 1 1.28 1.28L12 21l1.9-5.8a2 2 0 0 1 1.28-1.28L21 12l-5.8-1.9a2 2 0 0 1-1.28-1.28z"/></svg>
            Padronizar
          </button>
        </div>

        <textarea
          id="texto-docs"
          aria-label="Texto do planejamento"
          placeholder="Cole o texto aqui..."
        ></textarea>

        <h2>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          Terminal de Execução
        </h2>
        <textarea
          id="terminal-log"
          aria-label="Terminal de execução"
          role="log"
          aria-live="polite"
          readonly
        ></textarea>

        <div class="progress-container">
          <div
            class="progress-bar-bg"
            role="progressbar"
            id="barra-progresso-container"
            aria-label="Progresso da automação"
            aria-valuenow="0"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <div class="progress-bar-fill" id="barra-progresso"></div>
          </div>
          <span id="texto-progresso" class="text-progress">0%</span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
